<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Training">
<title>Training Program</title>
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
<style>
:root{--bg:#ffffff;--bg2:#f5f5f4;--bg3:#eeede9;--text:#1a1a1a;--text2:#6b6b6b;--text3:#a0a0a0;--border:rgba(0,0,0,0.12);--border2:rgba(0,0,0,0.22);--radius:8px;--danger-bg:#fcebeb;--danger-text:#a32d2d;--success-bg:#eaf3de;--success-text:#3b6d11;--shadow:rgba(0,0,0,0.15);--overlay:rgba(0,0,0,0.4)}
@media(prefers-color-scheme:dark){:root{--bg:#1c1c1e;--bg2:#2c2c2e;--bg3:#3a3a3c;--text:#f2f2f7;--text2:#aeaeb2;--text3:#636366;--border:rgba(255,255,255,0.12);--border2:rgba(255,255,255,0.22);--danger-bg:#3a1a1a;--danger-text:#f09595;--success-bg:#1a2e10;--success-text:#97c459;--shadow:rgba(0,0,0,0.6);--overlay:rgba(0,0,0,0.65)}}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
body{display:flex;flex-direction:column;max-width:480px;margin:0 auto}
.top-bar{padding:12px 14px 0;flex-shrink:0}
.block-bar{display:flex;gap:6px;align-items:center;margin-bottom:10px;flex-wrap:nowrap}
.block-btn{padding:5px 11px;font-size:12px;font-weight:500;border-radius:var(--radius);border:0.5px solid var(--border2);background:var(--bg);color:var(--text2);cursor:pointer;white-space:nowrap;flex-shrink:0}
.block-btn.active{background:var(--text);color:var(--bg);border-color:var(--text)}
.block-actions{display:flex;gap:6px;margin-left:auto}
.icon-btn{padding:6px 10px;font-size:15px;border-radius:var(--radius);border:0.5px solid var(--border2);background:var(--bg);color:var(--text2);cursor:pointer;display:flex;align-items:center;min-height:32px}
.icon-btn:active{background:var(--bg2)}
.save-status{font-size:11px;color:var(--text3);margin-left:6px;white-space:nowrap}
.save-status.saved{color:var(--success-text)}
.block-label-row{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.block-label-row label{font-size:11px;color:var(--text2);white-space:nowrap;text-transform:uppercase;letter-spacing:0.05em}
.editable-label{font-size:13px;font-weight:500;border:none;border-bottom:0.5px solid var(--border2);background:transparent;color:var(--text);padding:2px 0;width:100%;outline:none}
.tabs{display:flex;border-bottom:0.5px solid var(--border);flex-shrink:0}
.tab{flex:1;padding:8px 2px;font-size:12px;font-weight:500;text-align:center;cursor:pointer;border:none;background:none;color:var(--text2);border-bottom:2px solid transparent;margin-bottom:-1px;line-height:1.3;min-height:44px}
.tab.active{color:var(--text);border-bottom-color:var(--text)}
.tab-sub{display:block;font-size:10px;font-weight:400;color:var(--text3);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tab.active .tab-sub{color:var(--text2)}
.tab-sum{flex:1;padding:8px 2px;font-size:12px;font-weight:500;text-align:center;cursor:pointer;border:none;background:none;color:var(--text2);border-bottom:2px solid transparent;margin-bottom:-1px;min-height:44px}
.tab-sum.active{color:var(--text);border-bottom-color:var(--text)}
.panels{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.panel{display:none;padding:12px 14px}
.panel.active{display:block}
.day-label-row{display:flex;align-items:center;margin-bottom:10px}
.exercise-row{display:grid;grid-template-columns:1fr 108px;gap:8px;align-items:center;margin-bottom:8px;position:relative}
.sets-ctrl{display:flex;align-items:center;gap:2px;justify-content:flex-end}
.s-btn{width:36px;height:36px;border-radius:var(--radius);border:0.5px solid var(--border2);background:var(--bg2);color:var(--text);font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;user-select:none;-webkit-user-select:none;touch-action:manipulation}
.s-btn:active{background:var(--bg3);transform:scale(0.95)}
.s-num{min-width:32px;height:36px;text-align:center;font-size:14px;font-weight:500;color:var(--text);cursor:pointer;display:flex;align-items:center;justify-content:center;border-radius:var(--radius);background:transparent}
.s-num:active{background:var(--bg2)}
.ex-picker{position:relative;width:100%}
.ex-display{font-size:12px;padding:9px 24px 9px 10px;border-radius:var(--radius);border:0.5px solid var(--border);background:var(--bg);color:var(--text);width:100%;cursor:pointer;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;position:relative;min-height:36px;font-family:inherit}
.ex-display::after{content:"▾";position:absolute;right:8px;top:50%;transform:translateY(-50%);font-size:10px;color:var(--text3)}
.ex-none{color:var(--text3)}
.ex-dropdown{position:absolute;top:calc(100% + 4px);left:0;right:0;background:var(--bg);border:0.5px solid var(--border2);border-radius:var(--radius);z-index:100;display:none;box-shadow:0 4px 16px var(--shadow)}
.ex-dropdown.open{display:block}
.ex-search-wrap{padding:7px 8px;border-bottom:0.5px solid var(--border)}
.ex-search{width:100%;font-size:12px;padding:6px 8px;border-radius:var(--radius);border:0.5px solid var(--border2);background:var(--bg2);color:var(--text);outline:none;font-family:inherit}
.ex-list{max-height:240px;overflow-y:auto;-webkit-overflow-scrolling:touch}
.ex-group{font-size:10px;font-weight:500;letter-spacing:0.05em;text-transform:uppercase;color:var(--text3);padding:7px 10px 3px}
.ex-option{font-size:13px;padding:10px 10px;cursor:pointer;color:var(--text)}
.ex-option:active{background:var(--bg2)}
.ex-option.selected{font-weight:500}
.ex-group.hidden,.ex-option.hidden{display:none}
.ex-clear{font-size:12px;padding:10px;border-top:0.5px solid var(--border);color:var(--danger-text);cursor:pointer;text-align:left}
.ex-clear:active{background:var(--bg2)}
.ex-empty{font-size:12px;padding:14px 10px;color:var(--text3);text-align:center}
.legend{display:flex;gap:10px;margin-bottom:10px;font-size:11px;color:var(--text2)}
.leg-dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:3px}
.summary-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.m-card{border-radius:var(--radius);padding:10px 12px;cursor:pointer;transition:transform 0.08s ease,opacity 0.08s ease;user-select:none;-webkit-user-select:none}
.m-card:active{transform:scale(0.97);opacity:0.85}
.m-card.neutral{background:var(--bg2)}
.m-card.low{background:var(--danger-bg)}
.m-card.high{background:var(--success-bg)}
.m-name{font-size:11px;margin-bottom:3px;display:flex;justify-content:space-between;align-items:center}
.m-card.neutral .m-name{color:var(--text2)}
.m-card.low .m-name{color:var(--danger-text)}
.m-card.high .m-name{color:var(--success-text)}
.m-vals{display:flex;gap:5px;align-items:baseline}
.m-total{font-size:19px;font-weight:500}
.m-card.neutral .m-total{color:var(--text)}
.m-card.low .m-total{color:var(--danger-text)}
.m-card.high .m-total{color:var(--success-text)}
.m-days{font-size:11px;color:var(--text3)}
.m-detail{display:none;margin-top:8px;padding-top:8px;border-top:0.5px solid rgba(0,0,0,0.1)}
.m-card.low .m-detail{border-top-color:rgba(163,45,45,0.2)}
.m-card.high .m-detail{border-top-color:rgba(59,109,17,0.2)}
.m-card.open .m-detail{display:block}
.m-detail-day{font-size:11px;font-weight:500;margin:5px 0 2px}
.m-card.neutral .m-detail-day{color:var(--text2)}
.m-card.low .m-detail-day{color:var(--danger-text)}
.m-card.high .m-detail-day{color:var(--success-text)}
.m-detail-ex{display:flex;justify-content:space-between;font-size:11px;padding:1px 0}
.m-card.neutral .m-detail-ex{color:var(--text)}
.m-card.low .m-detail-ex{color:var(--danger-text)}
.m-card.high .m-detail-ex{color:var(--success-text)}
.chevron{font-size:11px;transition:transform 0.2s}
.m-card.open .chevron{transform:rotate(180deg)}
.total-card{grid-column:1/-1;background:var(--bg2);border-radius:var(--radius);padding:10px 12px;display:flex;justify-content:space-between;align-items:center;margin-top:2px}

/* Modal overlay (numpad + confirm reset) */
.modal-bg{position:fixed;inset:0;background:var(--overlay);display:none;align-items:center;justify-content:center;z-index:200;padding:20px}
.modal-bg.open{display:flex}
.modal{background:var(--bg);border-radius:12px;padding:18px;width:100%;max-width:280px;box-shadow:0 8px 32px var(--shadow)}
.modal-title{font-size:13px;color:var(--text2);text-align:center;margin-bottom:4px}
.modal-display{font-size:28px;font-weight:500;text-align:center;color:var(--text);padding:6px 0 12px;min-height:44px}
.numpad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.np-btn{height:48px;border:0.5px solid var(--border2);background:var(--bg2);color:var(--text);font-size:18px;font-weight:500;border-radius:var(--radius);cursor:pointer;font-family:inherit;touch-action:manipulation}
.np-btn:active{background:var(--bg3);transform:scale(0.96)}
.np-btn.action{background:var(--bg);font-size:14px}
.modal-actions{display:flex;gap:8px;margin-top:12px}
.modal-actions button{flex:1;padding:10px;font-size:14px;font-weight:500;border-radius:var(--radius);border:0.5px solid var(--border2);background:var(--bg);color:var(--text);cursor:pointer;font-family:inherit;touch-action:manipulation}
.modal-actions button:active{background:var(--bg2)}
.modal-actions .primary{background:var(--text);color:var(--bg);border-color:var(--text)}
.modal-actions .danger{background:var(--danger-bg);color:var(--danger-text);border-color:var(--danger-text)}
.modal-text{font-size:14px;color:var(--text);text-align:center;line-height:1.5;margin:6px 0 4px}
</style>
</head>
<body>
<div class="top-bar">
  <div class="block-bar">
    <button class="block-btn active" id="btn-A" onclick="switchBlock('A')">Block A</button>
    <button class="block-btn" id="btn-B" onclick="switchBlock('B')">Block B</button>
    <button class="block-btn" id="btn-C" onclick="switchBlock('C')">Block C</button>
    <div class="block-actions">
      <button class="icon-btn" onclick="confirmResetBlock()" title="Reset this block" aria-label="Reset this block"><i class="ti ti-refresh"></i></button>
    </div>
    <span class="save-status saved" id="save-status">Saved</span>
  </div>
  <div class="block-label-row">
    <label>Block&nbsp;name&nbsp;</label>
    <input class="editable-label" id="block-name-input" type="text" placeholder="e.g. Hypertrophy Phase" oninput="onBlockNameInput(this.value)">
  </div>
</div>
<div class="tabs">
  <button class="tab active" id="tab-d1" onclick="showTab('d1')">Day 1<span class="tab-sub" id="tabsub-d1"></span></button>
  <button class="tab" id="tab-d2" onclick="showTab('d2')">Day 2<span class="tab-sub" id="tabsub-d2"></span></button>
  <button class="tab" id="tab-d3" onclick="showTab('d3')">Day 3<span class="tab-sub" id="tabsub-d3"></span></button>
  <button class="tab-sum" id="tab-sum" onclick="showTab('sum')">Summary</button>
</div>
<div class="panels">
  <div id="d1" class="panel active"></div>
  <div id="d2" class="panel"></div>
  <div id="d3" class="panel"></div>
  <div id="sum" class="panel"></div>
</div>

<!-- Numpad modal -->
<div class="modal-bg" id="numpad-bg">
  <div class="modal">
    <div class="modal-title">Sets</div>
    <div class="modal-display" id="np-display">0</div>
    <div class="numpad">
      <button class="np-btn" onclick="npPress('1')">1</button>
      <button class="np-btn" onclick="npPress('2')">2</button>
      <button class="np-btn" onclick="npPress('3')">3</button>
      <button class="np-btn" onclick="npPress('4')">4</button>
      <button class="np-btn" onclick="npPress('5')">5</button>
      <button class="np-btn" onclick="npPress('6')">6</button>
      <button class="np-btn" onclick="npPress('7')">7</button>
      <button class="np-btn" onclick="npPress('8')">8</button>
      <button class="np-btn" onclick="npPress('9')">9</button>
      <button class="np-btn action" onclick="npClear()">Clear</button>
      <button class="np-btn" onclick="npPress('0')">0</button>
      <button class="np-btn action" onclick="npBack()">⌫</button>
    </div>
    <div class="modal-actions">
      <button onclick="closeNumpad()">Cancel</button>
      <button class="primary" onclick="confirmNumpad()">Set</button>
    </div>
  </div>
</div>

<!-- Reset confirm modal -->
<div class="modal-bg" id="reset-bg">
  <div class="modal">
    <div class="modal-text" id="reset-text">Reset this block? All exercises, sets, and the block name will be cleared.</div>
    <div class="modal-actions">
      <button onclick="closeResetModal()">Cancel</button>
      <button class="danger" onclick="doResetBlock()">Reset</button>
    </div>
  </div>
</div>

<script>
const EX={
  "Chest":[["Barbell Bench Press",{Chest:1,"Front Delt":0.5,Triceps:0.5}],["Dumbbell Bench Press",{Chest:1,"Front Delt":0.5,Triceps:0.5}],["Incline Dumbbell Bench Press",{Chest:1,"Front Delt":0.5,Triceps:0.5}],["Dumbbell Fly",{Chest:1,"Front Delt":0.5}],["Cable Crossover",{Chest:1,"Front Delt":0.5}],["Pec Deck",{Chest:1}],["Push-Up",{Chest:1,"Front Delt":0.5,Triceps:0.5}],["Landmine Press",{Chest:1,"Front Delt":0.5,Triceps:0.5}],["Dumbbell Pullover",{Chest:0.5,Lats:1,Triceps:0.5}]],
  "Back / Lats":[["Barbell Row",{Lats:1,Traps:1,"Rear Delt":0.5,Biceps:0.5,Erectors:0.5}],["Dumbbell Row",{Lats:1,Traps:1,"Rear Delt":0.5,Biceps:0.5}],["Underhand Barbell Row",{Lats:1,Traps:1,"Rear Delt":0.5,Biceps:0.5}],["Narrow Grip Cable Row",{Lats:1,Traps:1,"Rear Delt":0.5,Biceps:0.5}],["Wide Grip Cable Row",{Lats:1,Traps:1,"Rear Delt":0.5,Biceps:0.5}],["One Arm Cable Row",{Lats:1,Traps:1,"Rear Delt":0.5,Biceps:0.5}],["Lat Pulldown",{Lats:1,"Rear Delt":0.5,Biceps:0.5}],["One Arm Lat Pulldown",{Lats:1,"Rear Delt":0.5,Biceps:0.5}],["Pull-Ups",{Lats:1,Traps:0.5,"Rear Delt":0.5,Biceps:0.5}],["Chin-Ups",{Lats:1,Traps:0.5,"Rear Delt":0.5,Biceps:1}],["Back Fly",{Traps:0.5,"Rear Delt":1}]],
  "Shoulders":[["Barbell Shoulder Press",{Traps:0.5,"Front Delt":1,"Side Delt":1,Triceps:0.5}],["Dumbbell Shoulder Press",{Traps:0.5,"Front Delt":1,"Side Delt":1,Triceps:0.5}],["Barbell Push Press",{Traps:0.5,"Front Delt":1,"Side Delt":1,Triceps:0.5,Quads:0.5}],["Dumbbell Lateral Raise",{Traps:0.5,"Side Delt":1}],["Upright Row",{Traps:1,"Front Delt":0.5,"Side Delt":1,Biceps:0.5}],["Clean and Press",{Traps:1,"Front Delt":1,Quads:0.5,Glutes:0.5,Erectors:0.5}],["Face Pull",{Traps:1,"Rear Delt":1}]],
  "Traps":[["Dumbbell Shrug",{Traps:1}],["Trap Bar Shrug",{Traps:1}],["Cable Shrug",{Traps:1}],["Rack Pull",{Traps:1,Erectors:1,Hamstrings:0.5,Glutes:0.5}]],
  "Biceps":[["Barbell Curl",{Biceps:1}],["Dumbbell Curl",{Biceps:1}],["Cable Curl",{Biceps:1}],["EZ Bar Curl",{Biceps:1}],["EZ Bar Curl Reverse Grip",{Biceps:1}],["Hammer Curl",{Biceps:1}]],
  "Triceps":[["Dips",{Triceps:1,Chest:0.5,"Front Delt":0.5}],["EZ Bar Skullcrusher",{Triceps:1}],["Dumbbell Skullcrusher",{Triceps:1}],["Tricep Cable Pulldown",{Triceps:1}]],
  "Legs":[["Squat",{Quads:1,Hamstrings:0.5,Glutes:1,Erectors:0.5}],["Leg Press",{Quads:1,Hamstrings:0.5,Glutes:1}],["Leg Extension",{Quads:1}],["Lunge",{Quads:1,Hamstrings:0.5,Glutes:1}],["Trap Bar Deadlift",{Traps:0.5,Quads:1,Hamstrings:0.5,Glutes:1,Erectors:1}],["Deadlift",{Lats:0.5,Traps:0.5,Quads:0.5,Hamstrings:1,Glutes:1,Erectors:1}],["Stiff Leg Deadlift",{Hamstrings:1,Glutes:0.5,Erectors:1}],["Hamstring Curl",{Hamstrings:1}],["1 Leg Kettlebell Deadlift",{Hamstrings:1,Glutes:1,Erectors:0.5}]],
  "Core":[["Decline Sit Ups",{Abs:1,Obliques:0.5}],["Reverse Crunch",{Abs:1,Obliques:0.5}],["Cable Side Bend",{Abs:0.5,Obliques:1}],["Side Bend",{Abs:0.5,Obliques:1}],["Cable Baseball Bat Swing",{"Side Delt":0.5,Abs:0.5,Obliques:1}],["Back Bend",{Hamstrings:0.5,Glutes:0.5,Erectors:1}]]
};
const ALL_MUS=["Chest","Lats","Traps","Front Delt","Side Delt","Rear Delt","Biceps","Triceps","Quads","Hamstrings","Glutes","Calves","Abs","Erectors","Obliques"];
const BLOCKS=["A","B","C"],DAY_IDS=["d1","d2","d3"];
const MAX_SETS=99;
let curBlock="A",curTab="d1",activeDropdown=null;

function makeEmptyDay(){return{label:"",rows:Array(10).fill(null).map(()=>({ex:"",sets:0}))}}
function makeEmptyBlock(id){return{id,name:"Block "+id,days:{d1:makeEmptyDay(),d2:makeEmptyDay(),d3:makeEmptyDay()}}}

const mem={};
function storageKey(b){return"trainblock_v4_"+b}

// Load all blocks from localStorage on startup
function loadAllBlocks(){
  BLOCKS.forEach(b=>{
    try{
      const raw=localStorage.getItem(storageKey(b));
      if(raw){
        const parsed=JSON.parse(raw);
        // Validate shape; fall back to empty if corrupted
        if(parsed&&parsed.days&&parsed.days.d1&&parsed.days.d2&&parsed.days.d3){
          mem[b]=parsed;
          // Ensure name exists
          if(!mem[b].name)mem[b].name="Block "+b;
          return;
        }
      }
    }catch(e){}
    mem[b]=makeEmptyBlock(b);
  });
}

// Auto-save the current block
let saveTimer=null;
function autoSave(){
  if(saveTimer)clearTimeout(saveTimer);
  const status=document.getElementById("save-status");
  status.textContent="Saving…";
  status.classList.remove("saved");
  saveTimer=setTimeout(()=>{
    try{
      localStorage.setItem(storageKey(curBlock),JSON.stringify(mem[curBlock]));
      status.textContent="Saved";
      status.classList.add("saved");
    }catch(e){
      status.textContent="Save failed";
      status.classList.remove("saved");
    }
  },300);
}

function closeAllDropdowns(){if(activeDropdown){activeDropdown.classList.remove("open");activeDropdown=null}}
document.addEventListener("click",e=>{if(!e.target.closest(".ex-picker"))closeAllDropdowns()});

function makePicker(rowEx,onChange){
  const wrap=document.createElement("div");wrap.className="ex-picker";
  const display=document.createElement("button");display.className="ex-display";display.type="button";
  const dropdown=document.createElement("div");dropdown.className="ex-dropdown";
  const searchWrap=document.createElement("div");searchWrap.className="ex-search-wrap";
  const search=document.createElement("input");search.className="ex-search";search.type="text";search.placeholder="Search exercises…";
  search.setAttribute("readonly","readonly");
  searchWrap.appendChild(search);
  const list=document.createElement("div");list.className="ex-list";
  const clearBtn=document.createElement("div");clearBtn.className="ex-clear";clearBtn.textContent="Clear selection";
  dropdown.appendChild(searchWrap);dropdown.appendChild(list);dropdown.appendChild(clearBtn);
  let currentVal=rowEx;
  function updateDisplay(){
    display.textContent="";
    if(currentVal){display.classList.remove("ex-none");display.appendChild(document.createTextNode(currentVal))}
    else{display.classList.add("ex-none");display.appendChild(document.createTextNode("— select exercise —"))}
  }
  function buildList(query){
    list.innerHTML="";const q=query.toLowerCase().trim();let anyVisible=false;
    Object.entries(EX).forEach(([group,items])=>{
      const groupEl=document.createElement("div");groupEl.className="ex-group";groupEl.textContent=group;list.appendChild(groupEl);
      let groupHasVisible=false;
      items.forEach(([name])=>{
        if(q&&!name.toLowerCase().includes(q))return;
        groupHasVisible=true;anyVisible=true;
        const opt=document.createElement("div");opt.className="ex-option"+(name===currentVal?" selected":"");opt.textContent=name;
        opt.onclick=e=>{e.stopPropagation();currentVal=name;onChange(name);updateDisplay();closeAllDropdowns();renderSummary();autoSave()};
        list.appendChild(opt);
      });
      if(!groupHasVisible)groupEl.classList.add("hidden");else groupEl.classList.remove("hidden");
    });
    if(!anyVisible){const empty=document.createElement("div");empty.className="ex-empty";empty.textContent="No exercises found";list.appendChild(empty)}
  }
  search.oninput=()=>buildList(search.value);
  search.onclick=e=>{e.stopPropagation();search.removeAttribute("readonly");search.focus()};
  clearBtn.onclick=e=>{e.stopPropagation();currentVal="";onChange("",true);updateDisplay();closeAllDropdowns();renderSummary();autoSave()};
  display.onclick=e=>{
    e.stopPropagation();
    if(dropdown.classList.contains("open")){closeAllDropdowns()}
    else{
      closeAllDropdowns();dropdown.classList.add("open");activeDropdown=dropdown;
      search.setAttribute("readonly","readonly");search.value="";buildList("");
      const rect=wrap.getBoundingClientRect(),spaceBelow=window.innerHeight-rect.bottom;
      if(spaceBelow<260){dropdown.style.top="auto";dropdown.style.bottom="calc(100% + 4px)"}
      else{dropdown.style.top="calc(100% + 4px)";dropdown.style.bottom="auto"}
    }
  };
  updateDisplay();wrap.appendChild(display);wrap.appendChild(dropdown);return wrap;
}

function syncDayTabs(){DAY_IDS.forEach(d=>{document.getElementById("tabsub-"+d).textContent=mem[curBlock].days[d].label})}
function syncBlockButtons(){
  BLOCKS.forEach(b=>{const btn=document.getElementById("btn-"+b);btn.textContent=mem[b].name||"Block "+b;btn.classList.toggle("active",b===curBlock)});
  document.getElementById("block-name-input").value=mem[curBlock].name||"";syncDayTabs();
}
function onBlockNameInput(val){mem[curBlock].name=val;document.getElementById("btn-"+curBlock).textContent=val||"Block "+curBlock;autoSave()}

function switchBlock(b){curBlock=b;syncBlockButtons();DAY_IDS.forEach(renderDay);renderSummary();showTab(curTab);
  // Refresh save indicator to reflect this block's saved state
  const status=document.getElementById("save-status");status.textContent="Saved";status.classList.add("saved");
}
function showTab(id){
  curTab=id;closeAllDropdowns();
  ["d1","d2","d3","sum"].forEach(tid=>{
    const tab=document.getElementById("tab-"+tid);if(tab)tab.classList.toggle("active",tid===id);
    const panel=document.getElementById(tid);if(panel)panel.classList.toggle("active",tid===id);
  });
  if(id==="sum")renderSummary();
}

// Press-and-hold helper for +/- buttons
function attachRepeatPress(btn,action){
  let holdTimer=null,repeatTimer=null,active=false;
  function start(e){
    if(active)return;
    active=true;
    action(); // immediate first tick
    holdTimer=setTimeout(()=>{
      repeatTimer=setInterval(action,90);
    },420);
  }
  function stop(){
    active=false;
    if(holdTimer){clearTimeout(holdTimer);holdTimer=null}
    if(repeatTimer){clearInterval(repeatTimer);repeatTimer=null}
  }
  btn.addEventListener("pointerdown",e=>{e.preventDefault();start(e)});
  btn.addEventListener("pointerup",stop);
  btn.addEventListener("pointerleave",stop);
  btn.addEventListener("pointercancel",stop);
}

// Numpad state
let numpadCtx=null; // {dayId, rowIndex, numEl, value (string)}
function openNumpad(dayId,rowIndex,numEl){
  const sets=mem[curBlock].days[dayId].rows[rowIndex].sets;
  numpadCtx={dayId,rowIndex,numEl,value:String(sets)};
  document.getElementById("np-display").textContent=numpadCtx.value;
  document.getElementById("numpad-bg").classList.add("open");
}
function closeNumpad(){numpadCtx=null;document.getElementById("numpad-bg").classList.remove("open")}
function npPress(d){
  if(!numpadCtx)return;
  let v=numpadCtx.value;
  if(v==="0")v=d;else v+=d;
  if(parseInt(v,10)>MAX_SETS)v=String(MAX_SETS);
  numpadCtx.value=v;
  document.getElementById("np-display").textContent=v;
}
function npClear(){if(!numpadCtx)return;numpadCtx.value="0";document.getElementById("np-display").textContent="0"}
function npBack(){
  if(!numpadCtx)return;
  let v=numpadCtx.value;
  v=v.length<=1?"0":v.slice(0,-1);
  numpadCtx.value=v;
  document.getElementById("np-display").textContent=v;
}
function confirmNumpad(){
  if(!numpadCtx)return;
  const n=Math.max(0,Math.min(MAX_SETS,parseInt(numpadCtx.value,10)||0));
  const {dayId,rowIndex,numEl}=numpadCtx;
  mem[curBlock].days[dayId].rows[rowIndex].sets=n;
  numEl.textContent=n;
  closeNumpad();
  renderSummary();
  autoSave();
}
// Close numpad on backdrop tap
document.getElementById("numpad-bg").addEventListener("click",e=>{if(e.target.id==="numpad-bg")closeNumpad()});

// Reset block modal
function confirmResetBlock(){
  document.getElementById("reset-text").textContent=`Reset "${mem[curBlock].name||"Block "+curBlock}"? All exercises, sets, and the block name will be cleared.`;
  document.getElementById("reset-bg").classList.add("open");
}
function closeResetModal(){document.getElementById("reset-bg").classList.remove("open")}
function doResetBlock(){
  mem[curBlock]=makeEmptyBlock(curBlock);
  closeResetModal();
  syncBlockButtons();
  DAY_IDS.forEach(renderDay);
  renderSummary();
  autoSave();
}
document.getElementById("reset-bg").addEventListener("click",e=>{if(e.target.id==="reset-bg")closeResetModal()});

function renderDay(dayId){
  closeAllDropdowns();const dayData=mem[curBlock].days[dayId];
  const el=document.getElementById(dayId);el.innerHTML="";
  const labelRow=document.createElement("div");labelRow.className="day-label-row";
  const inp=document.createElement("input");inp.className="editable-label";inp.type="text";inp.value=dayData.label;inp.placeholder="Label (e.g. Push)";
  inp.oninput=e=>{dayData.label=e.target.value;document.getElementById("tabsub-"+dayId).textContent=e.target.value;autoSave()};
  labelRow.appendChild(inp);el.appendChild(labelRow);
  dayData.rows.forEach((row,i)=>{
    const div=document.createElement("div");div.className="exercise-row";
    const picker=makePicker(row.ex,(val,cleared)=>{
      dayData.rows[i].ex=val;
      // Bug fix #3: when exercise is cleared, also clear its sets
      if(cleared||val===""){
        dayData.rows[i].sets=0;
        // Find this row's num element and update it
        const n=div.querySelector(".s-num");if(n)n.textContent="0";
      }
    });
    const ctrl=document.createElement("div");ctrl.className="sets-ctrl";
    const minus=document.createElement("button");minus.className="s-btn";minus.textContent="−";minus.type="button";
    const num=document.createElement("span");num.className="s-num";num.textContent=row.sets;
    const plus=document.createElement("button");plus.className="s-btn";plus.textContent="+";plus.type="button";
    attachRepeatPress(minus,()=>{
      if(dayData.rows[i].sets>0){dayData.rows[i].sets--;num.textContent=dayData.rows[i].sets;renderSummary();autoSave()}
    });
    attachRepeatPress(plus,()=>{
      if(dayData.rows[i].sets<MAX_SETS){dayData.rows[i].sets++;num.textContent=dayData.rows[i].sets;renderSummary();autoSave()}
    });
    num.onclick=()=>openNumpad(dayId,i,num);
    ctrl.appendChild(minus);ctrl.appendChild(num);ctrl.appendChild(plus);
    div.appendChild(picker);div.appendChild(ctrl);el.appendChild(div);
  });
}

function exMuscles(name){for(const items of Object.values(EX)){for(const[n,m]of items){if(n===name)return m}}return{}}
function calcDay(dayId){
  const totals={};ALL_MUS.forEach(m=>totals[m]=0);
  mem[curBlock].days[dayId].rows.forEach(row=>{
    if(!row.ex)return; // orphan-sets guard
    const mults=exMuscles(row.ex);
    Object.entries(mults).forEach(([m,w])=>{totals[m]=(totals[m]||0)+row.sets*w});
  });
  return totals;
}
function calcDayBreakdown(dayId,muscle){
  const items=[];
  mem[curBlock].days[dayId].rows.forEach(row=>{
    if(!row.ex||!row.sets)return;
    const mults=exMuscles(row.ex);
    if(mults[muscle])items.push({ex:row.ex,sets:r05(row.sets*mults[muscle])});
  });
  return items;
}
function r05(v){return Math.round(v*2)/2}
function fmt(v){return v%1===0?v.toString():v.toFixed(1)}
function renderSummary(){
  const d1=calcDay("d1"),d2=calcDay("d2"),d3=calcDay("d3");
  const openCards=new Set(Array.from(document.querySelectorAll(".m-card.open")).map(el=>el.dataset.muscle));
  const el=document.getElementById("sum");
  el.innerHTML=`<div class="legend"><span><span class="leg-dot" style="background:var(--success-text)"></span>≥15 sets</span><span><span class="leg-dot" style="background:var(--text2)"></span>10–14</span><span><span class="leg-dot" style="background:var(--danger-text)"></span>&lt;10 sets</span></div><div class="summary-grid" id="sg"></div>`;
  const sg=document.getElementById("sg");let grand=0;
  const dayLabels=[mem[curBlock].days.d1.label||"Day 1",mem[curBlock].days.d2.label||"Day 2",mem[curBlock].days.d3.label||"Day 3"];
  ALL_MUS.forEach(m=>{
    const v1=r05(d1[m]||0),v2=r05(d2[m]||0),v3=r05(d3[m]||0),tot=r05(v1+v2+v3);grand+=tot;
    const cls=tot>=15?"high":tot<10?"low":"neutral";
    const card=document.createElement("div");card.className="m-card "+cls+(openCards.has(m)?" open":"");card.dataset.muscle=m;
    const nameRow=document.createElement("div");nameRow.className="m-name";nameRow.innerHTML=`<span>${m}</span><span class="chevron">▾</span>`;
    const valsRow=document.createElement("div");valsRow.className="m-vals";valsRow.innerHTML=`<span class="m-total">${fmt(tot)}</span><span class="m-days">${fmt(v1)}/${fmt(v2)}/${fmt(v3)}</span>`;
    const detail=document.createElement("div");detail.className="m-detail";
    [[d1,"d1"],[d2,"d2"],[d3,"d3"]].forEach(([,dayId],i)=>{
      const bd=calcDayBreakdown(dayId,m);if(!bd.length)return;
      const dl=document.createElement("div");dl.className="m-detail-day";dl.textContent=dayLabels[i];detail.appendChild(dl);
      bd.forEach(({ex,sets})=>{const r=document.createElement("div");r.className="m-detail-ex";r.innerHTML=`<span>${ex}</span><span>${fmt(sets)} set${sets===1?"":"s"}</span>`;detail.appendChild(r)});
    });
    card.appendChild(nameRow);card.appendChild(valsRow);card.appendChild(detail);
    card.onclick=()=>card.classList.toggle("open");
    sg.appendChild(card);
  });
  const tc=document.createElement("div");tc.className="total-card";
  tc.innerHTML=`<span style="font-size:13px;color:var(--text2);font-weight:500">Total sets</span><span style="font-size:22px;font-weight:500">${fmt(r05(grand))}</span>`;
  sg.appendChild(tc);
}

// Boot
loadAllBlocks();
DAY_IDS.forEach(renderDay);
syncBlockButtons();
renderSummary();
showTab("d1");
if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js')}
</script>
